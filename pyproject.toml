[project]
name = "als-insight"
version = "0.1.0"
description = "Reproducible RNA-seq biomarker discovery pipeline for ALS (GEO GSE124439) with leakage-free ML evaluation and a results API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zeineb Jemli" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Runtime dependencies are deliberately limited to what the web service needs:
# the deployed app only serves precomputed results.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Everything needed to download the data and run the analysis pipeline.
pipeline = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydeseq2>=0.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
    # CPU-only XGBoost build avoids pulling CUDA/NCCL wheels on Linux.
    "xgboost-cpu>=3.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "xgboost>=3.0; sys_platform == 'darwin'",
]

[project.scripts]
als-insight = "als_insight.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/als_insight"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The original university notebook is kept verbatim for reference.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "NPY", "PD", "N", "PTH", "C4", "T20"]
ignore = [
    "PLC0415", # heavy scientific imports are deferred so the CLI and API start fast
    "PLR0913", # scientific functions legitimately take many parameters
    "PLR2004", # magic values in comparisons are fine in thresholds/tests
    "N803",    # sklearn convention: X as argument name
    "N806",    # sklearn convention: X as variable name
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: end-to-end tests that run the full (synthetic) pipeline"]
filterwarnings = ["ignore::DeprecationWarning:anndata.*"]

[tool.coverage.run]
source = ["als_insight"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
packages = ["als_insight"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
